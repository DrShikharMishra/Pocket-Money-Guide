<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pocket Money Guide</title>
  <meta name="description" content="A calm personal finance companion. Maintain your balance." />
  <style>
    :root {
      --bg: #0c0c0e;
      --sidebar: #121214;
      --card: #1a1a1f;
      --card-hover: #222228;
      --text: #f2f2f7;
      --text-secondary: #8e8e9a;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --green: #34d399;
      --red: #f87171;
      --border: #2a2a32;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 14px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 17px;
      font-weight: 700;
      padding: 4px 12px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tagline {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 0 12px 20px;
      line-height: 1.4;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14.5px;
      font-weight: 500;
      transition: all 0.15s;
      margin-bottom: 3px;
      user-select: none;
    }

    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: #a5b4fc; }

    .nav-item svg { width: 19px; height: 19px; opacity: 0.9; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 12px 4px;
      font-size: 12px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(12,12,14,0.85);
      backdrop-filter: blur(12px);
    }

    .topbar h1 { font-size: 17px; font-weight: 600; }

    .topbar-actions { display: flex; gap: 10px; align-items: center; }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 550;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    /* Cards */
    .cards { display: flex; flex-direction: column; gap: 16px; max-width: 680px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      border: 1px solid var(--border);
    }

    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .card-title { font-size: 16px; font-weight: 650; }
    .badge {
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      background: rgba(52, 211, 153, 0.15); color: var(--green);
    }

    .card-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }

    .net-amount {
      font-size: 32px; font-weight: 700;
      letter-spacing: -0.6px; margin-bottom: 16px;
    }
    .net-amount.positive { color: var(--green); }
    .net-amount.negative { color: var(--red); }

    .row { display: flex; gap: 32px; margin-bottom: 14px; }

    .stat { display: flex; align-items: flex-start; gap: 9px; }
    .stat-icon {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; margin-top: 1px;
    }
    .stat-icon.expense { background: rgba(248,113,113,0.15); color: var(--red); }
    .stat-icon.income  { background: rgba(52,211,153,0.15); color: var(--green); }

    .stat-label { font-size: 12px; color: var(--text-secondary); }
    .stat-value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat-value.expense { color: var(--red); }
    .stat-value.income  { color: var(--green); }

    .insight {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; color: var(--text-secondary);
    }

    /* Transactions */
    .tx-list { display: flex; flex-direction: column; gap: 2px; max-width: 720px; }

    .tx-row {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px; border-radius: 12px;
      transition: background 0.12s; cursor: default;
    }
    .tx-row:hover { background: var(--card-hover); }

    .tx-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent-soft); color: #a5b4fc;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }

    .tx-info { flex: 1; min-width: 0; }
    .tx-cat { font-weight: 600; font-size: 15px; }
    .tx-note { font-size: 13px; color: var(--text-secondary); }

    .tx-amount {
      font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px;
    }

    /* Form */
    .form-card {
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 13px; color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14.5px;
      outline: none;
      transition: border 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    .segmented {
      display: flex; background: var(--bg); border-radius: 8px; padding: 3px;
      border: 1px solid var(--border);
    }
    .segmented button {
      flex: 1; border: none; background: transparent; color: var(--text-secondary);
      padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 500;
    }
    .segmented button.active { background: var(--accent); color: white; }

    /* Empty state */
    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 50vh; color: var(--text-secondary);
      text-align: center; gap: 10px;
    }
    .empty h3 { color: var(--text); font-weight: 600; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--card); border-radius: 16px; padding: 28px;
      width: 100%; max-width: 400px; border: 1px solid var(--border);
    }

    .modal h2 { font-size: 18px; margin-bottom: 20px; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* Responsive */
    @media (max-width: 800px) {
      .sidebar { width: 200px; }
      .content { padding: 18px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">₹</div>
      Pocket Money Guide
    </div>
    <div class="tagline">Maintain your balance.<br>A calm place for your money.</div>

    <div class="nav-item active" data-page="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Overview
    </div>
    <div class="nav-item" data-page="transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Transactions
    </div>
    <div class="nav-item" data-page="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Add Entry
    </div>
    <div class="nav-item" data-page="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Reports
    </div>

    <div class="sidebar-footer">
      Personal use only · Data stays on this computer
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="page-title">Overview</h1>
      <div class="topbar-actions">
        <button class="btn secondary" onclick="clearAllData()">Clear Data</button>
        <button class="btn" onclick="showPage('add')">+ Add</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Add Transaction</h2>
      <div class="form-group">
        <label>Type</label>
        <div class="segmented">
          <button type="button" id="type-expense" class="active" onclick="setType(true)">Expense</button>
          <button type="button" id="type-income" onclick="setType(false)">Income</button>
        </div>
      </div>
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Utilities</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Salary</option>
          <option>Transfer</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" id="note" placeholder="What was this for?" />
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveTransaction()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ========== Data (stored in browser localStorage) ==========
    let transactions = JSON.parse(localStorage.getItem('pmg_transactions') || '[]');
    let isExpense = true;

    const icons = {
      Food: '🍴', Transport: '🚗', Housing: '🏠', Utilities: '⚡',
      Entertainment: '📺', Health: '❤️', Salary: '💰', Transfer: '↔️', Other: '🏷️'
    };

    function save() {
      localStorage.setItem('pmg_transactions', JSON.stringify(transactions));
    }

    function formatINR(n) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency', currency: 'INR', minimumFractionDigits: 2
      }).format(n || 0);
    }

    function calc(list) {
      const income  = list.filter(t => !t.expense).reduce((s,t) => s + t.amount, 0);
      const expense = list.filter(t =>  t.expense).reduce((s,t) => s + t.amount, 0);
      return { income, expense, net: income - expense };
    }

    // ========== Pages ==========
    const pages = {
      overview() {
        const { income, expense, net } = calc(transactions);
        const pct = income > 0 ? Math.round((net / income) * 100) : 0;

        return `
          <div class="cards">
            <div class="card">
              <div class="card-header">
                <div class="card-title">Your Balance</div>
                <div class="badge">${net >= 0 ? 'Positive' : 'Watchful'}</div>
              </div>
              <div class="card-subtitle">All time</div>
              <div class="net-amount ${net >= 0 ? 'positive' : 'negative'}">${formatINR(net)}</div>
              <div class="row">
                <div class="stat">
                  <div class="stat-icon expense">↓</div>
                  <div>
                    <div class="stat-label">Expense</div>
                    <div class="stat-value expense">-${formatINR(expense)}</div>
                  </div>
                </div>
                <div class="stat">
                  <div class="stat-icon income">↑</div>
                  <div>
                    <div class="stat-label">Income</div>
                    <div class="stat-value income">+${formatINR(income)}</div>
                  </div>
                </div>
              </div>
              ${income > 0 ? `
                <div class="insight">
                  ✓ ${pct}% of income remaining after spending
                </div>` : ''}
            </div>

            <div class="card" style="text-align:center;padding:32px 20px;">
              <div style="font-size:15px;color:var(--text-secondary);line-height:1.6;">
                “Maintain your balance.”<br>
                <span style="font-size:13px;">A quiet space for your money. No pressure, just clarity.</span>
              </div>
            </div>
          </div>
        `;
      },

      transactions() {
        if (transactions.length === 0) {
          return `<div class="empty">
            <div style="font-size:40px;">📋</div>
            <h3>No transactions yet</h3>
            <p>Click “+ Add” to record your first entry.</p>
          </div>`;
        }

        const sorted = [...transactions].reverse();
        return `<div class="tx-list">
          ${sorted.map((t, i) => `
            <div class="tx-row">
              <div class="tx-icon">${icons[t.category] || '🏷️'}</div>
              <div class="tx-info">
                <div class="tx-cat">${t.category}</div>
                <div class="tx-note">${t.note || '—'}</div>
              </div>
              <div class="tx-amount" style="color:${t.expense ? 'var(--red)' : 'var(--green)'}">
                ${t.expense ? '-' : '+'}${formatINR(t.amount)}
              </div>
            </div>
          `).join('')}
        </div>`;
      },

      add() {
        // Opens modal instead
        openModal();
        return pages.overview();
      },

      reports() {
        const expenses = transactions.filter(t => t.expense);
        if (expenses.length === 0) {
          return `<div class="empty">
            <div style="font-size:40px;">📊</div>
            <h3>No expense data yet</h3>
            <p>Add some expenses to see where your money goes.</p>
          </div>`;
        }

        const cats = {};
        expenses.forEach(t => { cats[t.category] = (cats[t.category] || 0) + t.amount; });
        const sorted = Object.entries(cats).sort((a,b) => b[1] - a[1]);
        const total = sorted.reduce((s, [,v]) => s + v, 0);
        const colors = ['#f43f5e','#6366f1','#f97316','#a855f7','#34d399','#06b6d4','#ec4899'];

        let acc = 0;
        const stops = sorted.map(([, val], i) => {
          const start = acc;
          acc += (val / total) * 100;
          return `${colors[i % colors.length]} ${start}% ${acc}%`;
        }).join(', ');

        return `
          <div style="display:flex;flex-direction:column;align-items:center;gap:28px;max-width:480px;">
            <div style="position:relative;width:240px;height:240px;">
              <div style="
                width:240px;height:240px;border-radius:50%;
                background: conic-gradient(${stops});
                mask: radial-gradient(circle at center, transparent 60%, black 61%);
                -webkit-mask: radial-gradient(circle at center, transparent 60%, black 61%);
              "></div>
              <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                <div style="font-size:13px;color:var(--text-secondary)">Total Spent</div>
                <div style="font-size:20px;font-weight:700">${formatINR(total)}</div>
              </div>
            </div>

            <div style="width:100%;background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;">
              ${sorted.map(([name, val], i) => `
                <div style="display:flex;align-items:center;padding:13px 16px;gap:10px;border-bottom:1px solid var(--border);">
                  <div style="width:10px;height:10px;border-radius:50%;background:${colors[i % colors.length]};flex-shrink:0;"></div>
                  <div style="flex:1;font-weight:500">${name}</div>
                  <div style="font-variant-numeric:tabular-nums">${formatINR(val)}</div>
                  <div style="color:var(--text-secondary);width:40px;text-align:right;font-size:13px">${Math.round((val/total)*100)}%</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    };

    function showPage(name) {
      if (name === 'add') {
        openModal();
        return;
      }
      document.getElementById('content').innerHTML = pages[name]();
      document.getElementById('page-title').textContent =
        name.charAt(0).toUpperCase() + name.slice(1);
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === name);
      });
    }

    // ========== Modal ==========
    function openModal() {
      isExpense = true;
      document.getElementById('type-expense').classList.add('active');
      document.getElementById('type-income').classList.remove('active');
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      document.getElementById('category').value = 'Food';
      document.getElementById('modal').classList.add('show');
      document.getElementById('amount').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function setType(expense) {
      isExpense = expense;
      document.getElementById('type-expense').classList.toggle('active', expense);
      document.getElementById('type-income').classList.toggle('active', !expense);
    }

    function saveTransaction() {
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount || amount <= 0) {
        alert('Please enter a valid amount');
        return;
      }
      transactions.push({
        id: Date.now(),
        amount,
        category: document.getElementById('category').value,
        note: document.getElementById('note').value.trim(),
        expense: isExpense,
        date: new Date().toISOString()
      });
      save();
      closeModal();
      showPage('transactions');
    }

    function clearAllData() {
      if (confirm('Clear all transactions? This cannot be undone.')) {
        transactions = [];
        save();
        showPage('overview');
      }
    }

    // Nav clicks
    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => showPage(el.dataset.page));
    });

    // Close modal on overlay click
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    // Start
    showPage('overview');
  </script>
</body>
</html>
