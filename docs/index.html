<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Money Guide</title>
<style>
:root {
  --bg: #09090b;
  --bg2: #0f0f12;
  --sidebar: #0c0c0f;
  --card: #141418;
  --card2: #1a1a20;
  --border: #27272f;
  --text: #fafafa;
  --muted: #71717a;
  --accent: #818cf8;
  --accent2: #6366f1;
  --green: #4ade80;
  --red: #f87171;
  --orange: #fb923c;
  --yellow: #facc15;
  --purple: #c084fc;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
  font-size: 14px;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 240px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 10px;
  flex-shrink: 0;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px 16px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.3px;
}
.logo-icon {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.tagline {
  font-size: 11.5px;
  color: var(--muted);
  padding: 0 12px 18px;
  line-height: 1.45;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
  font-weight: 500;
  font-size: 13.5px;
  transition: all .15s;
  margin-bottom: 2px;
  user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.active { background: rgba(99,102,241,0.15); color: #a5b4fc; }
.nav-item .badge {
  margin-left: auto;
  background: var(--accent2);
  color: white;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
}
.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  line-height: 1.5;
}

/* ===== MAIN ===== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  height: 52px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(9,9,11,0.85);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
}
.topbar h1 { font-size: 15.5px; font-weight: 600; }
.topbar-right { display: flex; gap: 8px; align-items: center; }

/* Buttons */
.btn {
  background: var(--accent2);
  color: white;
  border: none;
  padding: 7px 14px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 550;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn:hover { filter: brightness(1.1); }
.btn.secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
}
.btn.secondary:hover { border-color: #444; color: var(--text); }
.btn.danger { background: #dc2626; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.icon { padding: 7px; }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 22px 24px 40px;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.card-title {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.grid-1 { display: flex; flex-direction: column; gap: 14px; max-width: 800px; }

.stat-value {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.stat-label { font-size: 12px; color: var(--muted); margin-top: 3px; }

.positive { color: var(--green); }
.negative { color: var(--red); }
.warning { color: var(--orange); }

/* Advice */
.advice {
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  background: rgba(99,102,241,0.07);
  border-radius: 0 8px 8px 0;
  margin-bottom: 10px;
  font-size: 13.5px;
  line-height: 1.5;
}
.advice.good { border-color: var(--green); background: rgba(74,222,128,0.07); }
.advice.warn { border-color: var(--orange); background: rgba(251,146,60,0.07); }
.advice.bad  { border-color: var(--red); background: rgba(248,113,113,0.07); }
.advice strong { display: block; margin-bottom: 2px; font-size: 13.5px; }

/* Score */
.score-ring {
  width: 88px; height: 88px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700;
  border: 5px solid;
  flex-shrink: 0;
}

/* Progress */
.bar {
  height: 7px;
  background: #27272f;
  border-radius: 4px;
  overflow: hidden;
  margin: 6px 0;
}
.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width .4s ease;
}

/* Transactions table */
.tx-table { width: 100%; border-collapse: collapse; }
.tx-table th {
  text-align: left;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.tx-table td {
  padding: 11px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
}
.tx-table tr:last-child td { border-bottom: none; }
.tx-table tr:hover td { background: rgba(255,255,255,0.02); }

.cat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 20px;
  background: rgba(99,102,241,0.12);
  font-size: 12.5px;
  font-weight: 500;
}

/* Filters */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.filters input, .filters select {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 11px;
  border-radius: 7px;
  font-size: 13px;
  outline: none;
}
.filters input:focus, .filters select:focus { border-color: var(--accent); }
.filters input { min-width: 180px; }

/* Form */
.form-group { margin-bottom: 13px; }
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
  font-weight: 500;
}
input, select, textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13.5px;
  outline: none;
  transition: border .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

.segmented {
  display: flex;
  background: var(--bg);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--border);
}
.segmented button {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 7px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  transition: all .15s;
}
.segmented button.active { background: var(--accent2); color: white; }

/* Modal */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(4px);
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}
.modal h2 { font-size: 16px; margin-bottom: 16px; font-weight: 650; }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
}

/* Empty */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}
.empty .icon { font-size: 36px; margin-bottom: 10px; }
.empty h3 { color: var(--text); margin-bottom: 6px; font-size: 16px; }

/* Budget row */
.budget-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.budget-row:last-child { border-bottom: none; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--card2);
  border: 1px solid var(--border);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 13.5px;
  z-index: 300;
  opacity: 0;
  transform: translateY(10px);
  transition: all .3s;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateY(0); }

/* Responsive */
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 800px) {
  .sidebar { width: 200px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">₹</div>
    Pocket Money Guide
  </div>
  <div class="tagline">Your honest finance advisor.<br>Maintain your balance.</div>

  <div class="nav-item active" data-page="advisor">Advisor</div>
  <div class="nav-item" data-page="dashboard">Dashboard</div>
  <div class="nav-item" data-page="transactions">Transactions</div>
  <div class="nav-item" data-page="budgets">Budgets</div>
  <div class="nav-item" data-page="goals">Goals</div>
  <div class="nav-item" data-page="recurring">Recurring</div>
  <div class="nav-item" data-page="insights">Insights</div>

  <div class="sidebar-footer">
    100% private · Offline · Personal use only<br>
    Data never leaves this computer
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <h1 id="pageTitle">Advisor</h1>
    <div class="topbar-right">
      <button class="btn secondary sm" onclick="exportData()">Export</button>
      <button class="btn secondary sm" onclick="importData()">Import</button>
      <button class="btn" onclick="openTxModal()">+ Add</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</main>

<!-- Transaction Modal -->
<div class="modal-bg" id="txModal">
  <div class="modal">
    <h2 id="txModalTitle">Add Transaction</h2>
    <div class="form-group">
      <label>Type</label>
      <div class="segmented">
        <button type="button" id="typeExp" class="active" onclick="setType(true)">Expense</button>
        <button type="button" id="typeInc" onclick="setType(false)">Income</button>
      </div>
    </div>
    <div class="form-group">
      <label>Amount (₹)</label>
      <input type="number" id="txAmount" placeholder="0" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="txCategory">
        <option>Food</option><option>Transport</option><option>Housing</option>
        <option>Utilities</option><option>Entertainment</option><option>Shopping</option>
        <option>Health</option><option>Education</option><option>Salary</option>
        <option>Freelance</option><option>Investment</option><option>Transfer</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="txDate">
    </div>
    <div class="form-group">
      <label>Note</label>
      <input type="text" id="txNote" placeholder="Optional note">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeTxModal()">Cancel</button>
      <button class="btn" id="txSaveBtn" onclick="saveTx()">Save</button>
    </div>
  </div>
</div>

<!-- Budget Modal -->
<div class="modal-bg" id="budgetModal">
  <div class="modal">
    <h2>Set Budget</h2>
    <div class="form-group">
      <label>Category</label>
      <select id="bCat">
        <option>Food</option><option>Transport</option><option>Housing</option>
        <option>Utilities</option><option>Entertainment</option><option>Shopping</option>
        <option>Health</option><option>Education</option><option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Monthly Limit (₹)</label>
      <input type="number" id="bLimit" placeholder="5000" min="1">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('budgetModal')">Cancel</button>
      <button class="btn" onclick="saveBudget()">Save</button>
    </div>
  </div>
</div>

<!-- Goal Modal -->
<div class="modal-bg" id="goalModal">
  <div class="modal">
    <h2>New Goal</h2>
    <div class="form-group">
      <label>Goal Name</label>
      <input type="text" id="gName" placeholder="Emergency Fund">
    </div>
    <div class="form-group">
      <label>Target Amount (₹)</label>
      <input type="number" id="gTarget" placeholder="100000" min="1">
    </div>
    <div class="form-group">
      <label>Already Saved (₹)</label>
      <input type="number" id="gCurrent" placeholder="0" min="0" value="0">
    </div>
    <div class="form-group">
      <label>Deadline (optional)</label>
      <input type="date" id="gDeadline">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('goalModal')">Cancel</button>
      <button class="btn" onclick="saveGoal()">Save Goal</button>
    </div>
  </div>
</div>

<!-- Recurring Modal -->
<div class="modal-bg" id="recModal">
  <div class="modal">
    <h2>Add Recurring</h2>
    <div class="form-group">
      <label>Type</label>
      <div class="segmented">
        <button type="button" id="rTypeExp" class="active" onclick="rIsExp=true;toggleRType()">Expense</button>
        <button type="button" id="rTypeInc" onclick="rIsExp=false;toggleRType()">Income</button>
      </div>
    </div>
    <div class="form-group">
      <label>Amount (₹)</label>
      <input type="number" id="rAmount" placeholder="0" min="1">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="rCat">
        <option>Salary</option><option>Freelance</option><option>Rent</option>
        <option>Utilities</option><option>Subscription</option><option>Food</option>
        <option>Transport</option><option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Frequency</label>
      <select id="rFreq">
        <option value="monthly">Monthly</option>
        <option value="weekly">Weekly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>
    <div class="form-group">
      <label>Note</label>
      <input type="text" id="rNote" placeholder="e.g. Netflix, Rent">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('recModal')">Cancel</button>
      <button class="btn" onclick="saveRecurring()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== STATE =====================
let tx = JSON.parse(localStorage.getItem('pmg_tx') || '[]');
let budgets = JSON.parse(localStorage.getItem('pmg_budgets') || '[]');
let goals = JSON.parse(localStorage.getItem('pmg_goals') || '[]');
let recurring = JSON.parse(localStorage.getItem('pmg_rec') || '[]');
let editId = null;
let isExpense = true;
let rIsExp = true;
let filterCat = '';
let filterType = '';
let searchQ = '';

const ICONS = {
  Food:'🍴', Transport:'🚗', Housing:'🏠', Utilities:'⚡', Entertainment:'🎮',
  Shopping:'🛍️', Health:'❤️', Education:'📚', Salary:'💰', Freelance:'💻',
  Investment:'📈', Transfer:'↔️', Subscription:'📺', Rent:'🔑', Other:'🏷️'
};

function save() {
  localStorage.setItem('pmg_tx', JSON.stringify(tx));
  localStorage.setItem('pmg_budgets', JSON.stringify(budgets));
  localStorage.setItem('pmg_goals', JSON.stringify(goals));
  localStorage.setItem('pmg_rec', JSON.stringify(recurring));
}

function fmt(n) {
  return new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', maximumFractionDigits:0 }).format(n||0);
}
function fmtFull(n) {
  return new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', minimumFractionDigits:2 }).format(n||0);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===================== CALCULATIONS =====================
function calc(list = tx) {
  const income = list.filter(t => !t.expense).reduce((s,t) => s+t.amount, 0);
  const expense = list.filter(t => t.expense).reduce((s,t) => s+t.amount, 0);
  return { income, expense, net: income-expense, rate: income>0 ? ((income-expense)/income)*100 : 0 };
}

function thisMonthTx() {
  const now = new Date();
  return tx.filter(t => {
    const d = new Date(t.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

function catSpend(cat, list = thisMonthTx()) {
  return list.filter(t => t.expense && t.category === cat).reduce((s,t) => s+t.amount, 0);
}

function catBreakdown(list = tx) {
  const m = {};
  list.filter(t => t.expense).forEach(t => { m[t.category] = (m[t.category]||0) + t.amount; });
  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}

// ===================== ADVISOR ENGINE =====================
function healthScore() {
  const { rate, net, income } = calc();
  let s = 40;
  if (net > 0) s += 15;
  if (rate >= 30) s += 25;
  else if (rate >= 20) s += 18;
  else if (rate >= 10) s += 10;
  else if (rate < 0) s -= 20;
  if (goals.length > 0) s += 8;
  if (budgets.length > 0) s += 7;
  if (tx.length >= 8) s += 5;

  const cats = catBreakdown(thisMonthTx());
  if (cats.length && income > 0) {
    const topPct = (cats[0][1] / Math.max(calc(thisMonthTx()).income,1)) * 100;
    if (topPct > 40) s -= 12;
    else if (topPct > 30) s -= 6;
  }
  // Budget overruns
  budgets.forEach(b => {
    if (catSpend(b.category) > b.limit) s -= 5;
  });
  return Math.max(0, Math.min(100, Math.round(s)));
}

function generateAdvice() {
  const all = calc();
  const month = calc(thisMonthTx());
  const cats = catBreakdown(thisMonthTx());
  const advice = [];

  if (tx.length === 0) {
    return [{ type:'warn', title:'Start tracking', text:'Add your income and expenses. The advisor becomes powerful only with real data.' }];
  }

  // Overspending
  if (all.net < 0) {
    advice.push({ type:'bad', title:'You are spending more than you earn',
      text:`Overall you are ${fmt(Math.abs(all.net))} in the red. This is the #1 problem. Cut non-essentials immediately.` });
  } else if (month.net < 0) {
    advice.push({ type:'bad', title:'This month you are overspending',
      text:`This month’s expenses exceed income by ${fmt(Math.abs(month.net))}. Review recent purchases.` });
  }

  // Savings rate
  if (all.rate < 5 && all.income > 0) {
    advice.push({ type:'bad', title:'Critical savings rate',
      text:`You are saving only ${all.rate.toFixed(1)}%. Aim for at least 20%. Automate a transfer to savings the day you get paid.` });
  } else if (all.rate < 15 && all.income > 0) {
    advice.push({ type:'warn', title:'Low savings rate',
      text:`Current savings rate is ${all.rate.toFixed(1)}%. Try to push it toward 20–30%.` });
  } else if (all.rate >= 25) {
    advice.push({ type:'good', title:'Excellent savings rate',
      text:`You are saving ${all.rate.toFixed(1)}% of your income. This is strong. Stay consistent.` });
  }

  // Category warnings
  if (cats.length) {
    const [topCat, topAmt] = cats[0];
    const topPct = month.income > 0 ? (topAmt / month.income)*100 : 0;

    if (['Food','Shopping','Entertainment'].includes(topCat) && topPct > 20) {
      advice.push({ type:'warn', title:`${topCat} is too high`,
        text:`${topCat} is taking ${topPct.toFixed(0)}% of this month’s income (${fmt(topAmt)}). Set a stricter budget and track daily.` });
    }
    if (topPct > 40 && topCat !== 'Housing' && topCat !== 'Rent') {
      advice.push({ type:'bad', title:`${topCat} is dominating your budget`,
        text:`${topCat} alone is ${topPct.toFixed(0)}% of income. This is unbalanced.` });
    }
  }

  // Budget overruns
  budgets.forEach(b => {
    const spent = catSpend(b.category);
    if (spent > b.limit) {
      advice.push({ type:'bad', title:`Budget blown: ${b.category}`,
        text:`You set ${fmt(b.limit)} but already spent ${fmt(spent)}. Stop spending in this category until next month.` });
    } else if (spent > b.limit * 0.85) {
      advice.push({ type:'warn', title:`${b.category} budget almost finished`,
        text:`${fmt(spent)} of ${fmt(b.limit)} used. Slow down.` });
    }
  });

  // Goals
  if (goals.length === 0) {
    advice.push({ type:'warn', title:'No goals set',
      text:'Money without a goal tends to disappear. Create at least an Emergency Fund goal.' });
  } else {
    goals.forEach(g => {
      const pct = (g.current / g.target) * 100;
      if (pct >= 100) {
        advice.push({ type:'good', title:`Goal achieved: ${g.name}`, text:'Congratulations! Set the next target.' });
      } else if (pct < 20) {
        advice.push({ type:'warn', title:`Goal “${g.name}” is lagging`,
          text:`Only ${pct.toFixed(0)}% complete. Consider a fixed monthly contribution.` });
      }
    });
  }

  // Emergency fund
  const hasEmergency = goals.some(g => /emergency/i.test(g.name));
  if (!hasEmergency && all.income > 0) {
    advice.push({ type:'warn', title:'Missing Emergency Fund',
      text:'Build 3–6 months of expenses as a safety net. Create a goal for it today.' });
  }

  // No income
  if (all.income === 0 && all.expense > 0) {
    advice.push({ type:'bad', title:'No income recorded',
      text:'You have expenses but zero income. Add your salary or other income for accurate advice.' });
  }

  // Positive
  if (advice.filter(a => a.type === 'bad').length === 0 && all.net > 0) {
    advice.push({ type:'good', title:'You are in control',
      text:'No major red flags. Keep tracking honestly and reviewing weekly.' });
  }

  return advice;
}

// ===================== UI CONTROL =====================
function showPage(name) {
  document.getElementById('content').innerHTML = pages[name]();
  document.getElementById('pageTitle').textContent = name.charAt(0).toUpperCase() + name.slice(1);
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === name);
  });
}

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => showPage(el.dataset.page));
});

// Modals
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function openTxModal(id = null) {
  editId = id;
  isExpense = true;
  document.getElementById('typeExp').classList.add('active');
  document.getElementById('typeInc').classList.remove('active');
  document.getElementById('txModalTitle').textContent = id ? 'Edit Transaction' : 'Add Transaction';
  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';
  document.getElementById('txCategory').value = 'Food';
  document.getElementById('txDate').value = new Date().toISOString().slice(0,10);

  if (id) {
    const t = tx.find(x => x.id == id);
    if (t) {
      isExpense = t.expense;
      document.getElementById('typeExp').classList.toggle('active', t.expense);
      document.getElementById('typeInc').classList.toggle('active', !t.expense);
      document.getElementById('txAmount').value = t.amount;
      document.getElementById('txCategory').value = t.category;
      document.getElementById('txNote').value = t.note || '';
      document.getElementById('txDate').value = t.date.slice(0,10);
    }
  }
  openModal('txModal');
  setTimeout(() => document.getElementById('txAmount').focus(), 80);
}
function closeTxModal() { closeModal('txModal'); editId = null; }

function setType(exp) {
  isExpense = exp;
  document.getElementById('typeExp').classList.toggle('active', exp);
  document.getElementById('typeInc').classList.toggle('active', !exp);
}

function toggleRType() {
  document.getElementById('rTypeExp').classList.toggle('active', rIsExp);
  document.getElementById('rTypeInc').classList.toggle('active', !rIsExp);
}

function saveTx() {
  const amount = parseFloat(document.getElementById('txAmount').value);
  if (!amount || amount <= 0) return alert('Enter a valid amount');
  const data = {
    id: editId || Date.now().toString(),
    amount,
    category: document.getElementById('txCategory').value,
    note: document.getElementById('txNote').value.trim(),
    expense: isExpense,
    date: document.getElementById('txDate').value || new Date().toISOString()
  };
  if (editId) {
    const idx = tx.findIndex(t => t.id == editId);
    if (idx >= 0) tx[idx] = data;
  } else {
    tx.push(data);
  }
  save();
  closeTxModal();
  showPage('transactions');
  toast(editId ? 'Transaction updated' : 'Transaction added');
}

function editTx(id) { openTxModal(id); }
function deleteTx(id) {
  if (!confirm('Delete this transaction?')) return;
  tx = tx.filter(t => t.id != id);
  save();
  showPage('transactions');
  toast('Deleted');
}

function saveBudget() {
  const cat = document.getElementById('bCat').value;
  const limit = parseFloat(document.getElementById('bLimit').value);
  if (!limit || limit <= 0) return alert('Enter a valid limit');
  const existing = budgets.findIndex(b => b.category === cat);
  if (existing >= 0) budgets[existing].limit = limit;
  else budgets.push({ category: cat, limit });
  save();
  closeModal('budgetModal');
  showPage('budgets');
  toast('Budget saved');
}
function deleteBudget(i) {
  budgets.splice(i,1);
  save();
  showPage('budgets');
}

function saveGoal() {
  const name = document.getElementById('gName').value.trim();
  const target = parseFloat(document.getElementById('gTarget').value);
  const current = parseFloat(document.getElementById('gCurrent').value) || 0;
  const deadline = document.getElementById('gDeadline').value || null;
  if (!name || !target) return alert('Fill name and target');
  goals.push({ name, target, current, deadline });
  save();
  closeModal('goalModal');
  showPage('goals');
  toast('Goal created');
}
function addToGoal(i) {
  const val = parseFloat(prompt('Amount to add (₹)'));
  if (!val || val <= 0) return;
  goals[i].current += val;
  save();
  showPage('goals');
  toast('Added to goal');
}
function deleteGoal(i) {
  if (!confirm('Delete this goal?')) return;
  goals.splice(i,1);
  save();
  showPage('goals');
}

function saveRecurring() {
  const amount = parseFloat(document.getElementById('rAmount').value);
  if (!amount) return alert('Enter amount');
  recurring.push({
    amount,
    category: document.getElementById('rCat').value,
    note: document.getElementById('rNote').value.trim(),
    expense: rIsExp,
    freq: document.getElementById('rFreq').value
  });
  save();
  closeModal('recModal');
  showPage('recurring');
  toast('Recurring added');
}
function deleteRec(i) {
  recurring.splice(i,1);
  save();
  showPage('recurring');
}

// Export / Import
function exportData() {
  const data = { tx, budgets, goals, recurring, exported: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pocket-money-guide-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.tx) tx = data.tx;
        if (data.budgets) budgets = data.budgets;
        if (data.goals) goals = data.goals;
        if (data.recurring) recurring = data.recurring;
        save();
        showPage('advisor');
        toast('Data imported successfully');
      } catch {
        alert('Invalid backup file');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Close modals on backdrop
['txModal','budgetModal','goalModal','recModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target.id === id) closeModal(id);
  });
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'n' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    openTxModal();
  }
});

// Start
showPage('advisor');
</script>
