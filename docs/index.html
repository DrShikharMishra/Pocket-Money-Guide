<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pocket Money Guide – Your Personal Finance Advisor</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --sidebar: #111114;
      --card: #18181c;
      --card-hover: #222228;
      --text: #f4f4f8;
      --muted: #8b8b9a;
      --accent: #6366f1;
      --accent-soft: rgba(99,102,241,0.14);
      --green: #34d399;
      --red: #f87171;
      --orange: #fb923c;
      --yellow: #fbbf24;
      --border: #2a2a32;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 22px 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 8px;
      font-weight: 700;
      font-size: 16px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }

    .tagline {
      font-size: 12px;
      color: var(--muted);
      padding: 0 10px 18px;
      line-height: 1.4;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 13px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
      margin-bottom: 2px;
      user-select: none;
    }

    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: #a5b4fc; }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px 10px 4px;
      font-size: 11.5px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      line-height: 1.4;
    }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      height: 54px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      background: rgba(11,11,13,0.9);
      backdrop-filter: blur(10px);
    }

    .topbar h1 { font-size: 16.5px; font-weight: 600; }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 550;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn.danger { background: #dc2626; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 26px;
    }

    /* Cards & Layout */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 960px; }
    .grid-1 { display: flex; flex-direction: column; gap: 16px; max-width: 720px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .big-number {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .warning { color: var(--orange); }

    /* Advice boxes */
    .advice {
      border-left: 4px solid var(--accent);
      padding: 14px 16px;
      background: rgba(99,102,241,0.08);
      border-radius: 0 10px 10px 0;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .advice.good { border-color: var(--green); background: rgba(52,211,153,0.08); }
    .advice.warn { border-color: var(--orange); background: rgba(251,146,60,0.08); }
    .advice.bad  { border-color: var(--red); background: rgba(248,113,113,0.08); }

    .advice strong { display: block; margin-bottom: 3px; }

    /* Score circle */
    .score-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .score-circle {
      width: 90px; height: 90px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700;
      border: 5px solid;
    }

    /* Progress bar */
    .progress-bar {
      height: 8px;
      background: #2a2a32;
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s;
    }

    /* Transactions */
    .tx-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .tx-row:last-child { border-bottom: none; }

    .tx-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }

    .tx-info { flex: 1; }
    .tx-cat { font-weight: 600; font-size: 14px; }
    .tx-note { font-size: 12.5px; color: var(--muted); }

    /* Form */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .segmented {
      display: flex;
      background: var(--bg);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border);
    }
    .segmented button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 7px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .segmented button.active { background: var(--accent); color: white; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--card);
      border-radius: 16px;
      padding: 26px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    .modal h2 { font-size: 17px; margin-bottom: 18px; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty h3 { color: var(--text); margin: 10px 0 6px; }

    .goal-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
      .sidebar { width: 210px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">₹</div>
      Pocket Money Guide
    </div>
    <div class="tagline">Your honest personal finance advisor.<br>Maintain your balance.</div>

    <div class="nav-item active" data-page="advisor">Advisor</div>
    <div class="nav-item" data-page="overview">Overview</div>
    <div class="nav-item" data-page="transactions">Transactions</div>
    <div class="nav-item" data-page="goals">Goals</div>
    <div class="nav-item" data-page="add">+ Add Entry</div>

    <div class="sidebar-footer">
      100% private · Data never leaves this computer<br>
      Built for personal use only
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="page-title">Advisor</h1>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" onclick="clearData()">Clear All Data</button>
        <button class="btn" onclick="openModal()">+ Add</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Add Transaction</h2>

      <div class="form-group">
        <label>Type</label>
        <div class="segmented">
          <button type="button" id="type-expense" class="active" onclick="setType(true)">Expense</button>
          <button type="button" id="type-income" onclick="setType(false)">Income</button>
        </div>
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" />
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Utilities</option>
          <option>Entertainment</option>
          <option>Shopping</option>
          <option>Health</option>
          <option>Education</option>
          <option>Salary</option>
          <option>Freelance</option>
          <option>Investment</option>
          <option>Transfer</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" id="note" placeholder="What was this for?" />
      </div>

      <div class="modal-actions">
        <button class="btn secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveTx()">Save</button>
      </div>
    </div>
  </div>

  <!-- Goal Modal -->
  <div class="modal-overlay" id="goalModal">
    <div class="modal">
      <h2>Set a Goal</h2>
      <div class="form-group">
        <label>Goal Name</label>
        <input type="text" id="goalName" placeholder="e.g. Emergency Fund, New Laptop" />
      </div>
      <div class="form-group">
        <label>Target Amount (₹)</label>
        <input type="number" id="goalTarget" placeholder="50000" min="1" />
      </div>
      <div class="form-group">
        <label>Current Saved (₹)</label>
        <input type="number" id="goalCurrent" placeholder="0" min="0" />
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="closeGoalModal()">Cancel</button>
        <button class="btn" onclick="saveGoal()">Save Goal</button>
      </div>
    </div>
  </div>

  <script>
    // ===================== DATA =====================
    let transactions = JSON.parse(localStorage.getItem('pmg_tx') || '[]');
    let goals = JSON.parse(localStorage.getItem('pmg_goals') || '[]');
    let isExpense = true;

    const icons = {
      Food:'🍴', Transport:'🚗', Housing:'🏠', Utilities:'⚡',
      Entertainment:'🎮', Shopping:'🛍️', Health:'❤️', Education:'📚',
      Salary:'💰', Freelance:'💻', Investment:'📈', Transfer:'↔️', Other:'🏷️'
    };

    function persist() {
      localStorage.setItem('pmg_tx', JSON.stringify(transactions));
      localStorage.setItem('pmg_goals', JSON.stringify(goals));
    }

    function formatINR(n) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency', currency: 'INR', maximumFractionDigits: 0
      }).format(n || 0);
    }

    function calc() {
      const income  = transactions.filter(t => !t.expense).reduce((s,t) => s + t.amount, 0);
      const expense = transactions.filter(t =>  t.expense).reduce((s,t) => s + t.amount, 0);
      return { income, expense, net: income - expense, savingsRate: income > 0 ? ((income - expense) / income) * 100 : 0 };
    }

    function categoryBreakdown() {
      const map = {};
      transactions.filter(t => t.expense).forEach(t => {
        map[t.category] = (map[t.category] || 0) + t.amount;
      });
      return Object.entries(map).sort((a,b) => b[1] - a[1]);
    }

    // ===================== ADVISOR ENGINE =====================
    function generateAdvice() {
      const { income, expense, net, savingsRate } = calc();
      const cats = categoryBreakdown();
      const advice = [];

      if (transactions.length === 0) {
        return [{
          type: 'warn',
          title: 'No data yet',
          text: 'Start by adding your income and expenses. The more honest you are, the better the advice becomes.'
        }];
      }

      // 1. Overall health
      if (net < 0) {
        advice.push({
          type: 'bad',
          title: 'You are spending more than you earn',
          text: `Your total expenses (${formatINR(expense)}) are higher than your income (${formatINR(income)}). This is the most important problem to fix. Immediately cut non-essential spending.`
        });
      } else if (savingsRate < 10) {
        advice.push({
          type: 'warn',
          title: 'Very low savings rate',
          text: `You are only keeping ${savingsRate.toFixed(1)}% of your income. Aim for at least 20%. Even small increases compound over time.`
        });
      } else if (savingsRate >= 20) {
        advice.push({
          type: 'good',
          title: 'Healthy savings rate',
          text: `You are saving ${savingsRate.toFixed(1)}% of your income. This is solid. Keep going.`
        });
      }

      // 2. Category warnings
      if (cats.length > 0) {
        const top = cats[0];
        const topPct = income > 0 ? (top[1] / income) * 100 : 0;

        if (top[0] === 'Food' && topPct > 25) {
          advice.push({
            type: 'warn',
            title: 'Food spending is high',
            text: `Food is taking ${topPct.toFixed(0)}% of your income (${formatINR(top[1])}). Try cooking more at home and setting a weekly food budget.`
          });
        }

        if (top[0] === 'Entertainment' && topPct > 15) {
          advice.push({
            type: 'warn',
            title: 'Entertainment is eating your money',
            text: `You spent ${formatINR(top[1])} on Entertainment. Review subscriptions and impulse spends.`
          });
        }

        if (top[0] === 'Shopping' && topPct > 15) {
          advice.push({
            type: 'warn',
            title: 'Shopping is a problem area',
            text: `Shopping took ${formatINR(top[1])}. Ask yourself before every purchase: “Do I need this or do I just want it?”`
          });
        }

        // General top category
        if (topPct > 35 && !['Housing', 'Rent'].includes(top[0])) {
          advice.push({
            type: 'bad',
            title: `${top[0]} is dominating your budget`,
            text: `${top[0]} alone is ${topPct.toFixed(0)}% of your income. This is unbalanced. Set a hard monthly limit for this category.`
          });
        }
      }

      // 3. Missing income
      if (income === 0 && expense > 0) {
        advice.push({
          type: 'bad',
          title: 'No income recorded',
          text: 'You have expenses but zero income logged. Add your salary or other income so the analysis becomes accurate.'
        });
      }

      // 4. Goals related
      if (goals.length === 0) {
        advice.push({
          type: 'warn',
          title: 'You have no goals set',
          text: 'Without clear goals, money just disappears. Set at least one goal (Emergency Fund, New Phone, Debt payoff, etc.).'
        });
      } else {
        goals.forEach(g => {
          const pct = Math.min(100, (g.current / g.target) * 100);
          if (pct < 30) {
            advice.push({
              type: 'warn',
              title: `Goal “${g.name}” needs attention`,
              text: `You are only ${pct.toFixed(0)}% of the way there. Consider automating a small transfer every month toward this goal.`
            });
          } else if (pct >= 100) {
            advice.push({
              type: 'good',
              title: `Goal “${g.name}” completed!`,
              text: 'Well done. Time to set the next one.'
            });
          }
        });
      }

      // 5. Emergency fund check (simple)
      const emergencyGoal = goals.find(g => g.name.toLowerCase().includes('emergency'));
      if (!emergencyGoal && income > 0) {
        advice.push({
          type: 'warn',
          title: 'No Emergency Fund detected',
          text: 'One of the smartest things you can do is build 3–6 months of expenses as an emergency fund. Create a goal for it.'
        });
      }

      // 6. Positive reinforcement
      if (advice.filter(a => a.type === 'bad').length === 0 && net > 0) {
        advice.push({
          type: 'good',
          title: 'You are in control',
          text: 'No major red flags right now. Stay consistent and keep tracking honestly.'
        });
      }

      return advice;
    }

    function healthScore() {
      const { savingsRate, net, income } = calc();
      let score = 50;

      if (net > 0) score += 15;
      if (savingsRate >= 20) score += 20;
      else if (savingsRate >= 10) score += 10;
      else if (savingsRate < 0) score -= 25;

      if (goals.length > 0) score += 10;
      if (transactions.length >= 5) score += 5;

      // Penalize heavy single category
      const cats = categoryBreakdown();
      if (cats.length && income > 0) {
        const topPct = (cats[0][1] / income) * 100;
        if (topPct > 40) score -= 15;
        else if (topPct > 30) score -= 8;
      }

      return Math.max(0, Math.min(100, Math.round(score)));
    }

    // ===================== PAGES =====================
    const pages = {
      advisor() {
        const score = healthScore();
        const adviceList = generateAdvice();
        const { income, expense, net, savingsRate } = calc();

        let scoreColor = score >= 70 ? 'var(--green)' : score >= 45 ? 'var(--orange)' : 'var(--red)';
        let scoreLabel = score >= 70 ? 'Good' : score >= 45 ? 'Needs Work' : 'Critical';

        return `
          <div class="grid-1">
            <div class="card">
              <div class="score-wrap">
                <div class="score-circle" style="border-color:${scoreColor};color:${scoreColor}">
                  ${score}
                </div>
                <div>
                  <div style="font-size:18px;font-weight:700">Money Health Score</div>
                  <div style="color:var(--muted);margin-top:4px">${scoreLabel}</div>
                  <div style="font-size:13px;color:var(--muted);margin-top:6px">
                    Based on savings rate, balance, goals, and spending patterns
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title">Honest Advice</div>
              ${adviceList.map(a => `
                <div class="advice ${a.type}">
                  <strong>${a.title}</strong>
                  ${a.text}
                </div>
              `).join('')}
            </div>

            <div class="card">
              <div class="card-title">Quick Snapshot</div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;text-align:center">
                <div>
                  <div style="font-size:12px;color:var(--muted)">Income</div>
                  <div class="big-number" style="font-size:20px;color:var(--green)">${formatINR(income)}</div>
                </div>
                <div>
                  <div style="font-size:12px;color:var(--muted)">Expense</div>
                  <div class="big-number" style="font-size:20px;color:var(--red)">${formatINR(expense)}</div>
                </div>
                <div>
                  <div style="font-size:12px;color:var(--muted)">Savings Rate</div>
                  <div class="big-number" style="font-size:20px">${savingsRate.toFixed(1)}%</div>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      overview() {
        const { income, expense, net, savingsRate } = calc();
        const cats = categoryBreakdown();

        return `
          <div class="grid-2">
            <div class="card">
              <div class="card-title">Net Balance</div>
              <div class="big-number ${net >= 0 ? 'positive' : 'negative'}">${formatINR(net)}</div>
              <div style="font-size:13px;color:var(--muted);margin-top:6px">
                ${net >= 0 ? 'You are in the green' : 'You are overspending'}
              </div>
            </div>

            <div class="card">
              <div class="card-title">Savings Rate</div>
              <div class="big-number">${savingsRate.toFixed(1)}%</div>
              <div style="font-size:13px;color:var(--muted);margin-top:6px">
                Target: 20% or higher
              </div>
            </div>

            <div class="card">
              <div class="card-title">Total Income</div>
              <div class="big-number positive">${formatINR(income)}</div>
            </div>

            <div class="card">
              <div class="card-title">Total Expense</div>
              <div class="big-number negative">${formatINR(expense)}</div>
            </div>
          </div>

          ${cats.length ? `
            <div class="card" style="margin-top:16px;max-width:720px">
              <div class="card-title">Where Your Money Goes</div>
              ${cats.map(([cat, amt]) => {
                const pct = expense > 0 ? (amt / expense) * 100 : 0;
                return `
                  <div style="margin-bottom:12px">
                    <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px">
                      <span>${icons[cat] || '🏷️'} ${cat}</span>
                      <span>${formatINR(amt)} · ${pct.toFixed(0)}%</span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" style="width:${pct}%;background:var(--accent)"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}
        `;
      },

      transactions() {
        if (!transactions.length) {
          return `<div class="empty"><div style="font-size:36px">📋</div><h3>No transactions yet</h3><p>Add your income and expenses to get started.</p></div>`;
        }

        const sorted = [...transactions].reverse();
        return `
          <div class="card" style="max-width:680px">
            ${sorted.map(t => `
              <div class="tx-row">
                <div class="tx-icon">${icons[t.category] || '🏷️'}</div>
                <div class="tx-info">
                  <div class="tx-cat">${t.category}</div>
                  <div class="tx-note">${t.note || '—'}</div>
                </div>
                <div style="font-weight:600;color:${t.expense ? 'var(--red)' : 'var(--green)'}">
                  ${t.expense ? '-' : '+'}${formatINR(t.amount)}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      goals() {
        return `
          <div style="max-width:600px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
              <div class="card-title" style="margin:0">Your Goals</div>
              <button class="btn" onclick="openGoalModal()">+ New Goal</button>
            </div>

            ${goals.length === 0 ? `
              <div class="empty">
                <div style="font-size:36px">🎯</div>
                <h3>No goals yet</h3>
                <p>Set a goal so your money has a purpose.</p>
              </div>
            ` : goals.map((g, i) => {
              const pct = Math.min(100, (g.current / g.target) * 100);
              const color = pct >= 100 ? 'var(--green)' : pct >= 50 ? 'var(--accent)' : 'var(--orange)';
              return `
                <div class="card goal-card" style="margin-bottom:12px">
                  <div style="display:flex;justify-content:space-between">
                    <strong>${g.name}</strong>
                    <span style="font-size:13px;color:var(--muted)">${pct.toFixed(0)}%</span>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width:${pct}%;background:${color}"></div>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)">
                    <span>${formatINR(g.current)} saved</span>
                    <span>Target: ${formatINR(g.target)}</span>
                  </div>
                  <div style="margin-top:8px">
                    <button class="btn secondary" style="font-size:12px;padding:5px 10px" onclick="addToGoal(${i})">+ Add Money</button>
                    <button class="btn secondary" style="font-size:12px;padding:5px 10px;margin-left:6px" onclick="deleteGoal(${i})">Delete</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    };

    // ===================== UI HELPERS =====================
    function showPage(name) {
      if (name === 'add') {
        openModal();
        return;
      }
      document.getElementById('content').innerHTML = pages[name]();
      document.getElementById('page-title').textContent =
        name.charAt(0).toUpperCase() + name.slice(1);
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === name);
      });
    }

    function openModal() {
      isExpense = true;
      document.getElementById('type-expense').classList.add('active');
      document.getElementById('type-income').classList.remove('active');
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      document.getElementById('category').value = 'Food';
      document.getElementById('modal').classList.add('show');
      setTimeout(() => document.getElementById('amount').focus(), 50);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function setType(expense) {
      isExpense = expense;
      document.getElementById('type-expense').classList.toggle('active', expense);
      document.getElementById('type-income').classList.toggle('active', !expense);
    }

    function saveTx() {
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount || amount <= 0) return alert('Enter a valid amount');

      transactions.push({
        id: Date.now(),
        amount,
        category: document.getElementById('category').value,
        note: document.getElementById('note').value.trim(),
        expense: isExpense,
        date: new Date().toISOString()
      });
      persist();
      closeModal();
      showPage('advisor');
    }

    function openGoalModal() {
      document.getElementById('goalName').value = '';
      document.getElementById('goalTarget').value = '';
      document.getElementById('goalCurrent').value = '0';
      document.getElementById('goalModal').classList.add('show');
    }

    function closeGoalModal() {
      document.getElementById('goalModal').classList.remove('show');
    }

    function saveGoal() {
      const name = document.getElementById('goalName').value.trim();
      const target = parseFloat(document.getElementById('goalTarget').value);
      const current = parseFloat(document.getElementById('goalCurrent').value) || 0;

      if (!name || !target || target <= 0) return alert('Please fill goal name and target');

      goals.push({ name, target, current });
      persist();
      closeGoalModal();
      showPage('goals');
    }

    function addToGoal(index) {
      const amount = prompt('How much do you want to add to this goal? (₹)');
      const val = parseFloat(amount);
      if (!val || val <= 0) return;
      goals[index].current += val;
      persist();
      showPage('goals');
    }

    function deleteGoal(index) {
      if (confirm('Delete this goal?')) {
        goals.splice(index, 1);
        persist();
        showPage('goals');
      }
    }

    function clearData() {
      if (confirm('This will delete ALL transactions and goals. Are you sure?')) {
        transactions = [];
        goals = [];
        persist();
        showPage('advisor');
      }
    }

    // Nav
    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => showPage(el.dataset.page));
    });

    // Close modals on overlay click
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });
    document.getElementById('goalModal').addEventListener('click', e => {
      if (e.target.id === 'goalModal') closeGoalModal();
    });

    // Start
    showPage('advisor');
  </script>
</body>
</html>
